name: Build CreateSoul AI Android APK

on:
  push:
    branches: [main]
    paths:
      - "capacitor.config.ts"
      - "package.json"
      - ".github/workflows/android-apk.yml"
      - "app/**"
      - "components/**"
      - "lib/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare Capacitor web directory
        run: |
          mkdir -p out
          printf '%s\n' '<!doctype html><html><head><meta charset="utf-8"><title>CreateSoul AI</title></head><body></body></html>' > out/index.html

      - name: Create Android project
        run: npx cap add android

      - name: Enable Android microphone permission
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          marker = '<uses-permission android:name="android.permission.INTERNET" />'
          permission = '<uses-permission android:name="android.permission.RECORD_AUDIO" />'
          if permission not in s:
              if marker in s:
                  s = s.replace(marker, marker + "\n    " + permission, 1)
              else:
                  s = s.replace("<application", permission + "\n    <application", 1)
              p.write_text(s)
          PY

      - name: Configure AdMob application ID (test fallback)
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, re
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          app_id = os.environ.get("ADMOB_APP_ID", "").strip() or "ca-app-pub-3940256099942544~3347511713"
          marker = 'android:name="com.google.android.gms.ads.APPLICATION_ID"'
          meta = f'<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="{app_id}" />'
          if marker in s:
              s = re.sub(r'<meta-data[^>]*android:name="com\\.google\\.android\\.gms\\.ads\\.APPLICATION_ID"[^>]*/>', meta, s, count=1)
          else:
              s = s.replace("<application", "<application\\n        " + meta, 1)
          p.write_text(s)
          print("Configured AdMob application ID: " + ("repository secret" if os.environ.get("ADMOB_APP_ID", "").strip() else "Google test ID"))
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CreateSoul-AI-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
