name: Android Play Store AAB

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-aab:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Prepare Capacitor web directory
        run: |
          mkdir -p out
          printf '<!doctype html><html><head><meta charset="utf-8"><title>CreateSoul AI</title></head><body></body></html>' > out/index.html

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Enforce Google Play target API 36
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/variables.gradle")
          if p.exists():
              s = p.read_text()
              s = re.sub(r'(compileSdkVersion\\s*=\\s*)\\d+', r'\\g<1>36', s)
              s = re.sub(r'(targetSdkVersion\\s*=\\s*)\\d+', r'\\g<1>36', s)
              p.write_text(s)
              print("\\n".join(line for line in s.splitlines() if "compileSdkVersion" in line or "targetSdkVersion" in line))
          PY

      - name: Configure optional Android release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64$KEYSTORE_PASSWORD$KEY_ALIAS$KEY_PASSWORD" ]; then
            echo "Signing secrets not configured; building an unsigned AAB/APK artifact."
            exit 0
          fi
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || (echo "All four Android signing secrets must be configured together." && exit 1)
          echo "$KEYSTORE_B64" | base64 --decode > android/createsoul-upload.jks
          export KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/build.gradle")
          s = p.read_text()
          if "signingConfigs {" not in s:
              s = s.replace("android {", """android {
              signingConfigs {
                  release {
                      storeFile file("createsoul-upload.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
          """, 1)
          pattern = r'(buildTypes\\s*\\{\\s*release\\s*\\{)'
          s, count = re.subn(pattern, r'\\1\\n            signingConfig signingConfigs.release', s, count=1)
          if count != 1:
              raise SystemExit("Could not attach release signing config safely.")
          p.write_text(s)
          PY

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build release AAB and APK
        working-directory: android
        run: ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: CreateSoul-AI-Android-release
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
