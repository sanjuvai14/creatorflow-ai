name: CreateSoul AI CI Build Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.12.4 --activate

      - name: Configure pnpm
        run: |
          pnpm config set registry https://registry.npmjs.org
          pnpm config set fetch-retries 2
          pnpm config set fetch-timeout 120000

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm run typecheck

      - name: Production build
        run: pnpm run build

      - name: Package final release
        run: |
          rm -rf .release-package
          mkdir .release-package
          tar --exclude=.git --exclude=node_modules --exclude=.next --exclude=.release-package -czf .release-package/CreateSoul-AI-final-release.tar.gz .
      
      - name: Upload final release package
        uses: actions/upload-artifact@v4
        with:
          name: CreateSoul-AI-final-release
          path: .release-package/CreateSoul-AI-final-release.tar.gz
          if-no-files-found: error
