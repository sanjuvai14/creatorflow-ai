name: Extract CreatorFlow AI v3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract v3 project
        run: |
          unzip -o CreatorFlow-AI-MVP-v3.zip -d .
          rm -f CreatorFlow-AI-MVP-v3.zip

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Add CreatorFlow AI v3 project structure" || echo "No changes to commit"
          git push
