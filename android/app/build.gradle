plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sanjuvai.creatorflow'
    compileSdk 36

    defaultConfig {
        applicationId 'com.sanjuvai.creatorflow'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
}
